[project]
name = "odin-backend"
version = "0.1.0"
description = "Backend para gerenciamento de processos de dados escolares"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Samuel", email = "colaco.samuel8@gmail.com" },
]

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "gunicorn==23.0.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "motor==3.7.0",
    "pymongo==4.10.1",
    "python-multipart==0.0.20",
    "dependency-injector==4.45.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.1",
    "ruff==0.8.6",
    "mypy==1.14.1",
    "pre-commit==4.0.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.1",
    "ruff==0.8.6",
    "mypy==1.14.1",
    "pre-commit==4.0.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
]
ignore = [
    "S101",   # assert usage (ok in tests)
    "S104",   # binding to 0.0.0.0 (intentional for containers)
    "UP006",  # use list instead of List (gradual migration)
    "UP007",  # use X | Y instead of Optional (gradual migration)
    "UP035",  # deprecated typing imports (gradual migration)
    "UP038",  # use X | Y in isinstance (gradual migration)
    "B008",   # function call in default arg (FastAPI Depends pattern)
    "E501",   # line too long (handled by formatter)
    "W291",   # trailing whitespace (handled by formatter)
    "W293",   # whitespace before ':' (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"src/presentation/http/schemas/*" = ["N815"]  # camelCase fields match MongoDB documents
"src/infrastructure/database/mapper/*" = ["B904"]  # existing exception chaining
"src/infrastructure/database/repository/*" = ["S110"]  # existing try/except/pass

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

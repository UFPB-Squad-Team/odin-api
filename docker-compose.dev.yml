# ─────────────────────────────────────────────────────────────────────────────
#  Odin API — Docker Compose (Development)
#  Usage: docker compose -f docker-compose.dev.yml up
# ─────────────────────────────────────────────────────────────────────────────

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: odin-api-dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - PORT=8000
    volumes:
      - ./src:/app/src:ro
    command: ["python", "-m", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
